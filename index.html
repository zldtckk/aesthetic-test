    options: [

  // -- Visual Q7: Detail --
  {
    type: 'visual',
    typeLabel: '视觉看图',
    question: '孩子会觉得哪一个「更好看、更用心」？',

// ============================================================
//  Report Templates
// ============================================================
const reports = {

    badge: '🌟',

// ============================================================
//  App State
// ============================================================
let currentQuestion = 0;
let answers = [];
let scores = [];

// ============================================================
//  Screen Management
// ============================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  // Scroll to top
  document.getElementById(id).scrollTop = 0;
}

// ============================================================
//  Welcome
// ============================================================
function startTest() {
  currentQuestion = 0;
  answers = [];
  scores = [];
  showScreen('question');
  renderQuestion();
}

// ============================================================
//  Question Rendering
// ============================================================
function renderQuestion() {
  const q = questions[currentQuestion];
  const counter = document.getElementById('qCounter');
  const typeBadge = document.getElementById('qTypeBadge');
  const progress = document.getElementById('progressFill');
  const container = document.getElementById('question-content');

  counter.textContent = `${currentQuestion + 1} / ${questions.length}`;
  typeBadge.textContent = q.typeLabel;
  progress.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;

  let visualPart = '';
  if (q.visualHTML) {
    visualPart = `<div class="visual-display fade-in">${q.visualHTML}</div>`;
  }

  let optionsHTML = q.options.map((opt, i) => `
    <button class="option-btn" onclick="selectOption(${i})" data-index="${i}">
      <span class="option-label">${opt.label}</span>
      <span class="option-text">${opt.text}</span>
    </button>
  `).join('');

  container.innerHTML = `
    <div class="question-text fade-in">${q.question}</div>
    ${visualPart}
    <div class="options-list fade-in" style="animation-delay:0.1s">
      ${optionsHTML}
    </div>
  `;
}

// ============================================================
//  Option Selection
// ============================================================
function selectOption(index) {
  // Prevent double-click
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.style.pointerEvents = 'none');

  // Mark selected
  btns[index].classList.add('selected');

  const q = questions[currentQuestion];
  answers[currentQuestion] = index;
  scores[currentQuestion] = q.options[index].score;

  // Next question or finish
  setTimeout(() => {
    if (currentQuestion < questions.length - 1) {
      currentQuestion++;
      renderQuestion();
    } else {
      showResults();
    }
  }, 300);
}

// ============================================================
//  Results
// ============================================================
function showResults() {
  showScreen('loading');

  // Simulate analysis delay
  setTimeout(() => {
    const total = scores.reduce((a, b) => a + b, 0);
    const maxScore = questions.length * 3;
    const percentage = (total / maxScore) * 100;

    let tier;
    if (percentage >= 80) {
      tier = 'talent';
    } else if (percentage >= 50) {
      tier = 'potential';
    } else {
      tier = 'beginner';
    }

    const report = reports[tier];
    const lightColors = { talent: '#e8f8ee', potential: '#fff3e0', beginner: '#f3e8ff' };
    const lightBg = lightColors[tier] || '#f0f0f0';
    const container = document.getElementById('reportContent');

    container.innerHTML = `
      <div class="report-header slide-up">
        <div class="report-badge">${report.badge}</div>
        <div class="report-type" style="color:${report.color}">${report.name}</div>
        <div class="report-tagline">${report.tagline}</div>
      </div>

      <div class="report-card slide-up" style="animation-delay:0.1s">
        <h3>🏷️ 关键词</h3>
        <div style="display:flex;flex-wrap:wrap;gap:8px;">
          ${report.keywords.map(k => `<span style="background:${lightBg};color:${report.color};padding:4px 14px;border-radius:20px;font-size:13px;font-weight:500;">${k}</span>`).join('')}
        </div>
      </div>

      <div class="report-card slide-up" style="animation-delay:0.15s">
        <h3>💡 核心优势</h3>
        <ul>
          ${report.strengths.map(s => `<li>${s}</li>`).join('')}
        </ul>
      </div>

      <div class="report-card slide-up" style="animation-delay:0.2s">
        <h3>🤖 AI 时代价值</h3>
        <p>${report.aiValue}</p>
      </div>

      <div class="report-card slide-up" style="animation-delay:0.25s">
        <h3>📈 培养建议</h3>
        <p>${report.advice}</p>
      </div>

      <div class="report-cta slide-up" style="animation-delay:0.3s">
        <h3>🎯 凭报告到店领取专属福利</h3>
        <p>AI 时代，成绩可以被 AI 超越，<br><strong>审美、品味、创造力</strong>才是孩子的核心竞争力！</p>
        <p style="font-size:13px;">凭本报告到店，免费领取 <strong>1v1 专属审美解读</strong> + <strong>定制培养方案</strong>，帮孩子赢在未来！</p>
        <button class="btn-cta" onclick="contactStore()">立即预约到店</button>
      </div>

      <div class="report-footer">
        <p style="font-size:13px;color:#86868b;line-height:1.6;">
          🤖 知识可以被 AI 替代，<br>
          但 <strong style="color:#1d1d1f;">审美、品味、创造力</strong> 才是孩子未来的核心竞争力。
        </p>
        <button class="re-share-btn" onclick="restartTest()">再测一次</button>
      </div>
    `;

    showScreen('report');
  }, 1800);
}

// ============================================================
//  Restart
// ============================================================
function restartTest() {
  currentQuestion = 0;
  answers = [];
  scores = [];
  showScreen('welcome');
  document.getElementById('reportContent').innerHTML = '';
}

function contactStore() {
  alert('📞 请联系我们预约到店：\n\n🏠 地址：XXX 艺术教育中心\n📱 电话：138-XXXX-XXXX\n\n（请将这里的联系方式替换为您的实际信息）');

</script>
