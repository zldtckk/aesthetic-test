  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  // Scroll to top
  document.getElementById(id).scrollTop = 0;
}

// ============================================================
//  Welcome
// ============================================================
function startTest() {
  currentQuestion = 0;
  answers = [];
  scores = [];
  showScreen('question');
  renderQuestion();
}

// ============================================================
//  Question Rendering
// ============================================================
function renderQuestion() {
  const q = questions[currentQuestion];
  const counter = document.getElementById('qCounter');
  const typeBadge = document.getElementById('qTypeBadge');
  const progress = document.getElementById('progressFill');
  const container = document.getElementById('question-content');

  counter.textContent = `${currentQuestion + 1} / ${questions.length}`;
  typeBadge.textContent = q.typeLabel;
  progress.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;

  let visualPart = '';
  if (q.visualHTML) {
    visualPart = `<div class="visual-display fade-in">${q.visualHTML}</div>`;
  }

  let optionsHTML = q.options.map((opt, i) => `
    <button class="option-btn" onclick="selectOption(${i})" data-index="${i}">
      <span class="option-label">${opt.label}</span>
      <span class="option-text">${opt.text}</span>
    </button>
  `).join('');

  container.innerHTML = `
    <div class="question-text fade-in">${q.question}</div>
    ${visualPart}
    <div class="options-list fade-in" style="animation-delay:0.1s">
      ${optionsHTML}
    </div>
  `;
}

// ============================================================
//  Option Selection
// ============================================================
function selectOption(index) {
  // Prevent double-click
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.style.pointerEvents = 'none');

  // Mark selected
  btns[index].classList.add('selected');

  const q = questions[currentQuestion];
  answers[currentQuestion] = index;
  scores[currentQuestion] = q.options[index].score;

  // Next question or finish
  setTimeout(() => {
    if (currentQuestion < questions.length - 1) {
      currentQuestion++;
      renderQuestion();
    } else {
      showResults();
    }
  }, 300);
}

// ============================================================
//  Results
// ============================================================
function generateCode() {
  const num = Math.floor(1000 + Math.random() * 9000);
  const letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  const l1 = letters[Math.floor(Math.random() * letters.length)];
  const l2 = letters[Math.floor(Math.random() * letters.length)];
  return `AST-${num}-${l1}${l2}`;
}

function getTier(total) {
  const maxScore = questions.length * 3;
  const percentage = (total / maxScore) * 100;
  if (percentage >= 80) return 'talent';
  if (percentage >= 50) return 'potential';
  return 'beginner';
}

function showResults() {
  showScreen('loading');

  const total = scores.reduce((a, b) => a + b, 0);
  const tier = getTier(total);
  const report = reports[tier];
  const claimCode = generateCode();
  const baseUrl = window.location.origin.includes('localhost')
    ? 'http://localhost:3000'
    : window.location.origin;

  // Submit to backend
  fetch(baseUrl + '/api/submit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      code: claimCode,
      tier: tier,
      total: total,
      answers: answers,
      scores: scores,
      timestamp: new Date().toISOString()
    })
  }).catch(() => {
    // Backend offline — store locally as fallback
    const data = JSON.parse(localStorage.getItem('ast_results') || '{}');
    data[claimCode] = { tier, total, answers, scores, timestamp: new Date().toISOString() };
    localStorage.setItem('ast_results', JSON.stringify(data));
  });

  // Show simplified result after short delay
  setTimeout(() => {
    const container = document.getElementById('reportContent');

    container.innerHTML = `
      <div class="simple-result slide-up">
        <span class="badge">${report.badge}</span>
        <div class="type-name" style="color:${report.color}">${report.name}</div>
        <div class="tagline">${report.tagline}</div>
      </div>

      <div class="claim-section slide-up" style="animation-delay:0.1s">
        <div class="label">👇 到店时出示此领取码</div>
        <div class="code">${claimCode}</div>
        <div class="hint">📱 截图保存，到店更快核销</div>
      </div>

      <div class="report-card slide-up" style="animation-delay:0.15s">
        <h3>📋 测试完成！</h3>
        <p>完整审美发展报告已为您生成，包含：<br>
        <strong>关键词解析 · 核心优势分析 · AI时代价值 · 定制培养建议</strong></p>
        <p style="margin-top:10px;">请携带上方领取码到店，我们的专业老师将为您进行 <strong>1v1 专属审美解读</strong>，并提供完整的纸质报告和定制培养方案。</p>
      </div>

      <div class="report-cta slide-up" style="animation-delay:0.2s">
        <h3>🎯 凭码到店领取完整报告</h3>
        <p>AI 时代，成绩可以被 AI 超越，<br><strong>审美、品味、创造力</strong>才是孩子的核心竞争力！</p>
        <p style="font-size:13px;">免费领取 <strong>1v1 专属审美解读</strong> + <strong>定制培养方案</strong></p>
        <button class="btn-cta" onclick="contactStore()">立即预约到店</button>
      </div>

      <div class="report-footer">
        <p style="font-size:13px;color:#86868b;line-height:1.6;">
          🤖 知识可以被 AI 替代，<br>
          但 <strong style="color:#1d1d1f;">审美、品味、创造力</strong> 才是孩子未来的核心竞争力。
        </p>
        <button class="re-share-btn" onclick="restartTest()">再测一次</button>
      </div>
    `;

    showScreen('report');
  }, 1500);
}

// ============================================================
//  Restart
// ============================================================
function restartTest() {
  currentQuestion = 0;
  answers = [];
  scores = [];
  showScreen('welcome');
  document.getElementById('reportContent').innerHTML = '';
}

function contactStore() {
  alert('📞 请联系我们预约到店：\n\n🏠 地址：XXX 艺术教育中心\n📱 电话：138-XXXX-XXXX\n\n（请将这里的联系方式替换为您的实际信息）');
}
</script>
